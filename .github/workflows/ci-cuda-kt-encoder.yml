# Lives only on ci/cuda-kt-encoder (= the PR commits + one workflow commit), never in the PR diff.
# Evidence: MSVC host compile and link of kt-encoder.cu (CUDA 13.3, sm_89), device compile for the CUDA 12
# default architecture list (50;61;70;75;80, includes a pre-dp4a target), and the --cuda-quantize fallback
# warning on CPU-only builds (Windows MSVC, Linux GCC, macOS arm64 clang). Hosted runners have no GPU.
# Controls: the PR base 32cddbfce, built the same way on Windows CUDA 13.3 and macOS arm64.
name: cuda-kt platforms
# push, not workflow_dispatch: a dispatch workflow must exist on the default branch first
on:
  push:
    branches: ['ci/cuda-kt-encoder']

env:
  RALPHQWEN_URL: https://huggingface.co/ji-farthing/RalphQwen3.8-Flash-Next-GGUF/resolve/main/RalphQwen3.8-Flash-Next-F32.gguf
  RALPHQWEN_SHA256: c818ee9dc38c4a40f36568d95475395387e7b3eca1ea24715b72d9ba3a3ea957

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # full link of llama-quantize, one architecture
          - cuda: '13.3'
            archs: '-DCMAKE_CUDA_ARCHITECTURES=89'
            object_only: false
            ref: ''
          # control: the same build of the PR base
          - cuda: '13.3'
            archs: '-DCMAKE_CUDA_ARCHITECTURES=89'
            object_only: false
            ref: '32cddbfce'
          # kt-encoder.cu only, CMake default architecture list for GGML_NATIVE=OFF
          - cuda: '12.8'
            archs: ''
            object_only: true
            ref: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}

      - name: Install Ninja
        run: choco install ninja -y

      # after the toolkit step, which reads .github/actions from the pushed commit
      - name: Check out the control ref
        if: ${{ matrix.ref != '' }}
        shell: bash
        run: git checkout --detach ${{ matrix.ref }} && git log -1 --oneline

      # origin/main since #2550: ik_decode_trits_sse2 is under __SSE2__, which MSVC does not define; its caller is under
      # __SSSE3__, which ggml-impl.h defines for MSVC. Same patch on the PR head and on the control.
      - name: Work around the MSVC build break in ggml-quants.c
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sed -i 's/^#if defined(__SSE2__)$/#if defined(__SSE2__) || defined(__SSSE3__)/' ggml/src/ggml-quants.c
          grep -n 'defined(__SSE2__) || defined(__SSSE3__)' ggml/src/ggml-quants.c

      - name: Configure and build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl 2>&1 | findstr /C:"Version"
          nvcc --version | findstr release
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_FATAL_WARNINGS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_OPENMP=ON -DLLAMA_CURL=OFF -DGGML_RPC=ON -DGGML_CUDA=ON ${{ matrix.archs }} || exit /b 1
          if "${{ matrix.object_only }}"=="true" (
            ninja -C build -t targets all > targets.txt
            findstr kt-encoder targets.txt
            for /f "tokens=1 delims=:" %%t in ('findstr kt-encoder.cu.obj targets.txt') do ninja -C build -v %%t || exit /b 1
          ) else (
            cmake --build build -j 4 --target llama-quantize || exit /b 1
          )

      - name: Fetch RalphQwen
        if: ${{ !matrix.object_only && matrix.ref == '' }}
        shell: bash
        run: |
          curl -L --fail -s -o ralphqwen.gguf "$RALPHQWEN_URL"
          echo "$RALPHQWEN_SHA256  ralphqwen.gguf" | sha256sum -c

      # no GPU and no NVIDIA driver on the runner: records what a CUDA build does with --cuda-quantize there
      - name: Run --cuda-quantize without a GPU
        if: ${{ !matrix.object_only && matrix.ref == '' }}
        continue-on-error: true
        shell: bash
        run: bash .github/ci-cuda-kt-run.sh

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !matrix.object_only && matrix.ref == '' }}
        with:
          name: logs-windows-cuda-${{ matrix.cuda }}
          path: '*.log'

  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, ref: ''}
          - {os: ubuntu-24.04, ref: ''}
          - {os: macos-14, ref: ''}
          # control: the PR base on macOS arm64
          - {os: macos-14, ref: '32cddbfce'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the control ref
        if: ${{ matrix.ref != '' }}
        shell: bash
        run: git checkout --detach ${{ matrix.ref }} && git log -1 --oneline

      # origin/main since #2550: ik_decode_trits_sse2 is under __SSE2__, which MSVC does not define; its caller is under
      # __SSSE3__, which ggml-impl.h defines for MSVC. Same patch on the PR head and on the control.
      - name: Work around the MSVC build break in ggml-quants.c
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sed -i 's/^#if defined(__SSE2__)$/#if defined(__SSE2__) || defined(__SSSE3__)/' ggml/src/ggml-quants.c
          grep -n 'defined(__SSE2__) || defined(__SSSE3__)' ggml/src/ggml-quants.c

      - name: Build (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        # GGML_RPC=ON links ws2_32, which ggml-rpc-transport.cpp needs on main
        run: |
          choco install ninja -y
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl 2>&1 | findstr /C:"Version"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_FATAL_WARNINGS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_OPENMP=ON -DLLAMA_CURL=OFF -DGGML_RPC=ON -DGGML_CUDA=OFF || exit /b 1
          cmake --build build -j 4 --target llama-quantize || exit /b 1

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_METAL=OFF -DLLAMA_CURL=OFF
          cmake --build build -j 4 --target llama-quantize
          ${CXX:-c++} --version | head -1

      - name: Fetch RalphQwen
        if: ${{ matrix.ref == '' }}
        shell: bash
        run: |
          curl -L --fail -s -o ralphqwen.gguf "$RALPHQWEN_URL"
          echo "$RALPHQWEN_SHA256  ralphqwen.gguf" | (sha256sum -c 2>/dev/null || shasum -a 256 -c)

      - name: Run --cuda-quantize on a build without CUDA
        if: ${{ matrix.ref == '' }}
        shell: bash
        run: |
          bash .github/ci-cuda-kt-run.sh
          grep -q 'ignoring --cuda-quantize because this build has no CUDA backend' flag.log
          cmp plain.gguf flag.gguf

      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.ref == '' }}
        with:
          name: logs-cpu-${{ matrix.os }}
          path: '*.log'
